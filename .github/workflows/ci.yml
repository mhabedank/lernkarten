name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pipx install ruff==0.16.2
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: pytest
        # No engine on the runner, so the end-to-end module skips itself here —
        # the e2e job below runs it with one.
        run: python -m pytest

  cards:
    name: Card validation & build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Nothing is installed here on purpose: the first build fetches the
      # typesetting engine itself, which is exactly what a new user gets.
      - name: Check the schema and test-build
        run: bin/lernkarten check cards/*.yaml
      - name: Report the engine
        run: bin/lernkarten engine --check
      - name: Build the PDF for real
        run: bin/lernkarten build cards/*.yaml -o output/cards.pdf
      - name: Build the borderless, logo-free layout
        run: bin/lernkarten build cards/*.yaml --margin 0 --no-logo -o output/borderless.pdf
      - name: Build with a non-default card language
        run: bin/lernkarten build cards/*.yaml --language german -o output/other-language.pdf
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: example-pdf
          path: output/*.pdf
          if-no-files-found: error

  e2e:
    name: End-to-end (demo project)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: pdftotext, so the PDF extraction paths are really exercised
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Build the binary test data (PDFs, scan, image, DOCX)
        run: python3 scripts/make_testdata.py
      - name: The demo project matches the documented contracts
        run: python3 scripts/check_project.py tests/fixtures/demo-project --strict
      - name: Command, typesetter and PDF, end to end
        # LERNKARTEN_E2E=1 lets the first test fetch the engine; locally the
        # module skips instead of downloading anything.
        env:
          LERNKARTEN_E2E: "1"
        run: python -m pytest tests/test_e2e.py tests/test_testdata.py tests/test_ingest_sources.py -v
      - name: The demo cards as a PDF
        run: bin/lernkarten build tests/fixtures/demo-project/cards/*.yaml -o output/demo.pdf
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: demo-pdf
          path: output/demo.pdf
          if-no-files-found: error

  oldest-python:
    name: Runtime on the oldest supported Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The floor from pyproject.toml. Keep the two in step.
          python-version: "3.11"
      - name: Build the example cards with nothing installed
        run: python3 scripts/build_pdf.py --check cards/example.yaml

  docs:
    name: Skills & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check skill frontmatter and doc links
        run: python3 scripts/check_docs.py
