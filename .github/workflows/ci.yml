name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pipx install ruff==0.16.2
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  cards:
    name: Card validation & build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Nothing is installed here on purpose: the first build fetches the
      # typesetting engine itself, which is exactly what a new user gets.
      - name: Check the schema and test-build
        run: bin/lernkarten check cards/*.yaml
      - name: Report the engine
        run: bin/lernkarten engine --check
      - name: Build the PDF for real
        run: bin/lernkarten build cards/*.yaml -o output/cards.pdf
      - name: Build the borderless, logo-free layout
        run: bin/lernkarten build cards/*.yaml --margin 0 --no-logo -o output/borderless.pdf
      - name: Build with a non-default card language
        run: bin/lernkarten build cards/*.yaml --language german -o output/other-language.pdf
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: example-pdf
          path: output/*.pdf
          if-no-files-found: error

  oldest-python:
    name: Runtime on the oldest supported Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Build the example cards with nothing installed
        run: python3 scripts/build_pdf.py --check cards/example.yaml

  docs:
    name: Skills & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check skill frontmatter and doc links
        run: python3 scripts/check_docs.py
