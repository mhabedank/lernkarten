name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pipx install ruff==0.16.2
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  cards:
    name: Card validation & LaTeX build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-pictures texlive-lang-german \
            texlive-fonts-recommended lmodern poppler-utils
      - name: Check the schema and test-compile
        run: python3 scripts/build_pdf.py --check cards/*.yaml
      - name: Build the PDF for real
        run: python3 scripts/build_pdf.py cards/*.yaml -o output/cards.pdf
      - name: Build the borderless, logo-free layout
        run: python3 scripts/build_pdf.py cards/*.yaml --margin 0 --no-logo -o output/borderless.pdf
      - name: Build with a non-default typesetting language
        run: python3 scripts/build_pdf.py cards/*.yaml --language ngerman -o output/ngerman.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: example-pdf
          path: output/*.pdf
          if-no-files-found: error

  docs:
    name: Skills & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Check skill frontmatter and doc links
        run: python3 scripts/check_docs.py
