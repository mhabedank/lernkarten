# Example cards — schema reference and template smoke test.
# Delete once you have cards of your own.
#
# Card text is written in single quotes, so a backslash is a line break and
# double quotes can be used freely. Maths goes between dollar signs.
topic: 'Example: Probability'
language: english
# The card size this deck is written for: a7 (2x4, 8 to an A4 sheet) or a8
# (4x4, 16 up, on a landscape sheet). The key is optional and leaving it out
# means a7, so this line only states what would happen anyway — state it, so
# `/print` never has to guess and nobody has to remember a flag. Both grids hold
# the same text: a8 renders the same card smaller, it does not hold less.
grid: a7
cards:
  - id: N29V0
    subtopic: 'Basics'
    front: 'What is a sample space $Omega$?'
    back: 'The set of all possible outcomes of a random experiment. \ Die roll: $Omega = {1,2,3,4,5,6}$'
    source: 'Example source'
  - id: 4V946
    subtopic: 'Basics'
    front: 'State the three Kolmogorov axioms.'
    back: '#list([$P(A) >= 0$ for every event $A$], [$P(Omega) = 1$], [$sigma$-additivity for disjoint events])'
    source: 'Example source'
  - id: 45HE2
    subtopic: 'Bayes theorem'
    front: 'How is Bayes theorem stated?'
    back: '$P(A | B) = (P(B | A) P(A)) / P(B)$'
    source: 'Example source'
  - id: KJMNM
    subtopic: 'Bayes theorem'
    front: 'What do prior and posterior mean in Bayes theorem?'
    back: 'Prior $P(A)$: belief before the observation. \ Posterior $P(A | B)$: belief updated after observing $B$.'
    source: 'Example source'
  - id: NSZZA
    subtopic: 'Distributions'
    front: 'Give the mean and variance of the binomial distribution $B(n, p)$.'
    back: '$E[X] = n p$ \ $"Var"(X) = n p (1-p)$'
    source: 'Example source'
  - id: BX2T4
    subtopic: 'Distributions'
    front: 'When does the normal distribution approximate the binomial well?'
    back: 'Rule of thumb: when $n p (1-p) >= 9$. \ Then $B(n,p) approx cal(N)(n p, n p (1-p))$.'
    source: 'Example source'
  - id: HEHSC
    subtopic: 'Distributions'
    front: 'What separates a density from a distribution function?'
    back: 'Density $f(x)$: derivative of the distribution function, not a probability. \ Distribution function $F(x) = P(X <= x)$: cumulative probability.'
    source: 'Example source'
  - id: 7MXQ2
    subtopic: 'Limit theorems'
    front: 'What does the weak law of large numbers state?'
    back: 'The mean of independent, identically distributed variables converges in probability to the expected value: $overline(X)_n scripts(->)^P mu$.'
    source: 'Example source'
  - id: 77VJ7
    subtopic: 'Limit theorems'
    front: 'What does the central limit theorem state?'
    back: 'The standardised sum of i.i.d. variables with finite variance converges in distribution to $cal(N)(0,1)$.'
    source: 'Example source'
  # A picture on the back. `back_image` (and `front_image`, for a card that asks
  # "what does this show?") names a file relative to the project root — the
  # folder your cards/ directory sits in. The engine reads png, jpg, jpeg, gif,
  # svg and webp. The text stays: a card whose whole answer is a picture has
  # nothing to read, so the answer says what the picture shows and the picture
  # shows it.
  - id: 7QH3T
    subtopic: 'Basics'
    front: 'Describe the path from a sample space to a probability'
    back: 'An event is a subset of the sample space; $P$ maps that subset to a number in $[0,1]$.'
    back_image: 'assets/example-figure.svg'
    source: 'Example source'
