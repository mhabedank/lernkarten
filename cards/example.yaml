topic: "Example: Probability"
cards:
  - subtopic: "Basics"
    front: "What is a sample space $\\Omega$?"
    back: "The set of all possible outcomes of a random experiment.\\\\ Die roll: $\\Omega = \\{1,2,3,4,5,6\\}$"
    source: "Example source"
  - subtopic: "Basics"
    front: "State the three Kolmogorov axioms."
    back: "\\begin{itemize}\\item $P(A) \\geq 0$ for every event $A$\\item $P(\\Omega) = 1$\\item $\\sigma$-additivity for disjoint events\\end{itemize}"
    source: "Example source"
  - subtopic: "Bayes' theorem"
    front: "How is Bayes' theorem stated?"
    back: "$P(A \\mid B) = \\dfrac{P(B \\mid A)\\, P(A)}{P(B)}$"
    source: "Example source"
  - subtopic: "Bayes' theorem"
    front: "What do prior and posterior mean in Bayes' theorem?"
    back: "Prior $P(A)$: belief before the observation.\\\\ Posterior $P(A \\mid B)$: belief updated after observing $B$."
    source: "Example source"
  - subtopic: "Distributions"
    front: "Give the mean and variance of the binomial distribution $B(n, p)$."
    back: "$E[X] = np$\\\\ $\\operatorname{Var}(X) = np(1-p)$"
    source: "Example source"
  - subtopic: "Distributions"
    front: "When does the normal distribution approximate the binomial well?"
    back: "Rule of thumb: when $np(1-p) \\geq 9$.\\\\ Then $B(n,p) \\approx \\mathcal{N}(np,\\, np(1-p))$."
    source: "Example source"
  - subtopic: "Distributions"
    front: "What separates a density from a distribution function?"
    back: "Density $f(x)$: derivative of the distribution function, not a probability.\\\\ Distribution function $F(x) = P(X \\leq x)$: cumulative probability."
    source: "Example source"
  - subtopic: "Limit theorems"
    front: "What does the weak law of large numbers state?"
    back: "The mean of independent, identically distributed variables converges in probability to the expected value: $\\bar{X}_n \\xrightarrow{P} \\mu$."
    source: "Example source"
  - subtopic: "Limit theorems"
    front: "What does the central limit theorem state?"
    back: "The standardised sum of i.i.d. variables with finite variance converges in distribution to $\\mathcal{N}(0,1)$."
    source: "Example source"
