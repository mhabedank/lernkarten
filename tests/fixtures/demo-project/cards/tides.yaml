  - id: F3M2Q
    subtopic: 'Range and the rule of twelfths'
    front: 'Describe how the range is distributed over the six hours of the flood'
    back: 'One twelfth, two, three, three, two, one — half the range is passed after the third hour.'
    back_image: 'figures/island-images/tide-chart.svg'
    source: 'Tide chart, harbour office'
  - id: K7WT4
    subtopic: 'Range and the rule of twelfths'
    front: 'What does this chart show?'
    front_image: 'figures/island-images/tide-chart.svg'
    back: 'The rule of twelfths: how the tidal range is spread over the six hours between low and high water.'
    source: 'Tide chart, harbour office'
