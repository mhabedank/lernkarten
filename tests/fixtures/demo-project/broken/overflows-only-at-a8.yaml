# The card that tells the two grids apart.
#
# Its back fits an A7 card (2 x 4 up, field 93.2 x 51.4 mm) and does not fit an
# A8 one (4 x 4 up, field 43.2 x 51.4 mm — 46 % of the area). So `check` is
# silent at the default and reports this card at `--grid a8`.
#
# That asymmetry is the whole point. The overflow set is computed by a second
# engine call (`typst query <overflow>`), which takes its own copy of the
# --input values; if the grid reaches the compile call but not the query, the
# PDF is right and every warning is wrong. No assertion of *absence* can catch
# that — the demo cards overflow at neither grid, so the query comes back empty
# on the correct and the broken path alike. Only a card that overflows at one
# grid and not the other does, which is this one.
topic: 'Broken: fits A7, not A8'
language: english
cards:
  - subtopic: 'Fits either grid'
    front: 'How long is a tidal day?'
    back: '$24 "h" 50 "min"$.'
    source: 'Demo'
  - subtopic: 'Fits A7 only'
    front: 'How is the rise distributed over the six hours of flood?'
    back: 'In twelfths of the range: one, two, three, three, two and one. Half the range is reached after three hours, and the fastest rise falls in the third and fourth hour. The rule is a working approximation, not a law — it assumes a smooth semidiurnal curve.'
    source: 'Demo'
