topic: 'Tides'
language: english
grid: a8
cards:
  - subtopic: 'Rhythm'
    front: 'What makes the Ashwind tide semidiurnal?'
    back: 'Two high waters and two low waters per tidal day.'
    source: 'Field notes 2'
  - subtopic: 'Rhythm'
    front: 'How long is a tidal day?'
    back: '$24 "h" 50 "min"$.'
    source: 'Field notes 2'
  - subtopic: 'Rhythm'
    front: 'Why does high water shift each day?'
    back: 'The moon returns to the meridian about 50 minutes later.'
    source: 'Field notes 2'
  - subtopic: 'Range'
    front: 'How is the tidal range $R$ defined?'
    back: 'The height of high water minus the height of low water.'
    source: 'Field notes 2'
  - subtopic: 'Range'
    front: 'Give the mean range at Torvig Harbour.'
    back: '$3.4 "m"$.'
    source: 'Field notes 2'
  - subtopic: 'Range'
    front: 'State the rule of twelfths.'
    back: 'The range rises as $1/12, 2/12, 3/12, 3/12, 2/12, 1/12$.'
    source: 'Field notes 2'
  - subtopic: 'Springs'
    front: 'When do spring tides occur?'
    back: 'Two days after new moon and after full moon.'
    source: 'Field notes 2'
  - subtopic: 'Springs'
    front: 'What is the age of the tide?'
    back: 'The two-day lag between the moon phase and the spring tide.'
    source: 'Field notes 2'
  - subtopic: 'Springs'
    front: 'Give the neap range at Torvig Harbour.'
    back: '$1.7 "m"$.'
    source: 'Field notes 2'
  - subtopic: 'Chart datum'
    front: 'What do charted soundings refer to?'
    back: 'Chart datum — the lowest astronomical tide.'
    source: 'Field notes 2'
  - subtopic: 'Chart datum'
    front: 'Why is a sounding a worst case?'
    back: 'The real depth is almost always greater than the charted one.'
    source: 'Field notes 2'
  - subtopic: 'Currents'
    front: 'What is slack water?'
    back: 'The pause between flood and ebb, when the stream barely runs.'
    source: 'Field notes 2'
  - subtopic: 'Rhythm'
    front: 'Describe the rule of twelfths'
    back: 'One twelfth, two, three, three, two, one.'
    back_image: 'figures/island-images/tide-chart.svg'
    source: 'Tide chart'
