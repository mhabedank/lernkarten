[project]
name = "lernkarten"
version = "0.1.0"
description = "Claude-Code-Skill-Set: beliebige Wissensquellen zu druckfertigen Lernkarten"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
