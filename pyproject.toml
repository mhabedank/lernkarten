[project]
name = "lernkarten"
version = "0.2.0"
description = "Claude Code plugin: turn any knowledge source into print-ready flashcards"
readme = "README.md"
license = { file = "LICENSE" }
# The tools run on the Python that ships with macOS and most Linux systems,
# and need nothing from PyPI. Development (pytest, ruff) wants 3.10 or newer.
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
