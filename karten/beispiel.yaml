# Beispielkarten — dienen als Schema-Referenz und Template-Test.
# Löschen, sobald eigene Karten existieren.
thema: "Beispiel: Wahrscheinlichkeit"
karten:
  - unterthema: "Grundbegriffe"
    vorne: "Was ist ein Ergebnisraum $\\Omega$?"
    hinten: "Die Menge aller möglichen Ergebnisse eines Zufallsexperiments.\\\\ Beispiel Würfel: $\\Omega = \\{1,2,3,4,5,6\\}$"
    quelle: "Beispielquelle"
  - unterthema: "Grundbegriffe"
    vorne: "Wie sind die drei Kolmogorow-Axiome definiert?"
    hinten: "\\begin{itemize}\\item $P(A) \\geq 0$ für alle Ereignisse $A$\\item $P(\\Omega) = 1$\\item $\\sigma$-Additivität für disjunkte Ereignisse\\end{itemize}"
    quelle: "Beispielquelle"
  - unterthema: "Satz von Bayes"
    vorne: "Wie lautet der Satz von Bayes?"
    hinten: "$P(A \\mid B) = \\dfrac{P(B \\mid A)\\, P(A)}{P(B)}$"
    quelle: "Beispielquelle"
  - unterthema: "Satz von Bayes"
    vorne: "Was bedeuten Prior und Posterior im Satz von Bayes?"
    hinten: "Prior $P(A)$: Einschätzung vor der Beobachtung.\\\\ Posterior $P(A \\mid B)$: aktualisierte Einschätzung nach Beobachtung von $B$."
    quelle: "Beispielquelle"
  - unterthema: "Verteilungen"
    vorne: "Nenne Erwartungswert und Varianz der Binomialverteilung $B(n, p)$."
    hinten: "$E[X] = np$\\\\ $\\operatorname{Var}(X) = np(1-p)$"
    quelle: "Beispielquelle"
  - unterthema: "Verteilungen"
    vorne: "Wann approximiert die Normalverteilung die Binomialverteilung gut?"
    hinten: "Faustregel: wenn $np(1-p) \\geq 9$.\\\\ Dann gilt $B(n,p) \\approx \\mathcal{N}(np,\\, np(1-p))$."
    quelle: "Beispielquelle"
  - unterthema: "Verteilungen"
    vorne: "Was unterscheidet Dichte und Verteilungsfunktion?"
    hinten: "Dichte $f(x)$: Ableitung der Verteilungsfunktion, keine Wahrscheinlichkeit.\\\\ Verteilungsfunktion $F(x) = P(X \\leq x)$: kumulierte Wahrscheinlichkeit."
    quelle: "Beispielquelle"
  - unterthema: "Grenzwertsätze"
    vorne: "Was besagt das Gesetz der großen Zahlen (schwach)?"
    hinten: "Das arithmetische Mittel unabhängiger, identisch verteilter Zufallsvariablen konvergiert stochastisch gegen den Erwartungswert: $\\bar{X}_n \\xrightarrow{P} \\mu$."
    quelle: "Beispielquelle"
  - unterthema: "Grenzwertsätze"
    vorne: "Was besagt der zentrale Grenzwertsatz?"
    hinten: "Die standardisierte Summe i.i.d. Zufallsvariablen mit endlicher Varianz konvergiert in Verteilung gegen $\\mathcal{N}(0,1)$."
    quelle: "Beispielquelle"
