# Vorlage für das Quellenregister.
#
# Kopieren nach `sources.yaml` (wird nicht versioniert) — oder einfach
# `/quellen <pfad-oder-url>` aufrufen, das legt die Datei bei Bedarf an.
#
# Typen: ordner | pdf | zotero | webseite
#
# Felder je Typ:
#   ordner    pfad (Pflicht), muster (glob, optional), notiz
#   pdf       pfad (Pflicht), seiten (z. B. "1-150", optional), notiz
#   zotero    sammlung (Name; ohne Angabe = ganze Bibliothek), notiz
#   webseite  url (Pflicht), tiefe (0 = nur diese Seite, 1 = plus verlinkte
#             Unterseiten derselben Domain), login (true, wenn die Seite eine
#             angemeldete Sitzung braucht), notiz

quellen:
  - id: skript-vorlesung
    typ: ordner
    pfad: ~/Documents/Uni/Statistik
    muster: "*.pdf"
    notiz: "Vorlesungsskripte — Beispieleintrag, anpassen oder löschen"

  - id: lehrbuch
    typ: pdf
    pfad: ~/Books/Lehrbuch.pdf
    seiten: "1-150"

  - id: zotero-sammlung
    typ: zotero
    sammlung: "Machine Learning"
    notiz: "Zotero 7 muss beim /erfassen laufen (lokale API auf Port 23119)"

  - id: wiki-bayes
    typ: webseite
    url: https://de.wikipedia.org/wiki/Satz_von_Bayes
    tiefe: 0
