# Template for the source register.
#
# Copy to `sources.yaml` (not versioned) — or just run
# `/sources <path-or-url>`, which creates the file if needed.
#
# Types: folder | pdf | zotero | web
#
# Fields per type:
#   folder    path (required), pattern (glob, optional), note
#   pdf       path (required), pages (e.g. "1-150", optional), note
#   zotero    collection (name; omit for the whole library), note
#   web       url (required), depth (0 = this page only, 1 = plus linked
#             subpages on the same domain), login (true if the page needs a
#             signed-in session), note

sources:
  - id: lecture-notes
    type: folder
    path: ~/Documents/University/Statistics
    pattern: "*.pdf"
    note: "Lecture notes — example entry, adapt or delete"

  - id: textbook
    type: pdf
    path: ~/Books/Textbook.pdf
    pages: "1-150"

  - id: zotero-collection
    type: zotero
    collection: "Machine Learning"
    note: "Zotero 7 has to be running during /ingest (local API on port 23119)"

  - id: wiki-bayes
    type: web
    url: https://en.wikipedia.org/wiki/Bayes%27_theorem
    depth: 0

  # Written by /research-gaps, never by hand — shown here so you recognise one.
  # It closes a `Status: gap` subtopic of catalog/topics.md and names which;
  # the URLs it was built from live in the documents, not on the entry.
